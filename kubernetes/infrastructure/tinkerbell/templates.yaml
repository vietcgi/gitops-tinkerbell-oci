---
# Ubuntu 24.04 LTS (Noble Numbat) Installation Template
# Uses nsenter to refresh the partition table after writing the image (fixes mount failures)
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: ubuntu-2404
  namespace: tink-system
spec:
  data: |
    version: "0.1"
    name: ubuntu-2404
    global_timeout: 1800
    tasks:
      - name: os-installation
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
          - /lib/firmware:/lib/firmware:ro
        actions:
          # Official Ubuntu 24.04 cloud image, pinned dated build. SHA256 is from that
          # directory's SHA256SUMS (signed by the UEC Image Automatic Signing Key,
          # D2EB44626FDDC30B513D5BB71A5D6C4C7DB87C81). The old source,
          # https://hookos.qualityspace.com/noble.raw.gz, returns 404.
          # Layout: sda1 = root, sda14 = BIOS boot, sda15 = EFI, sda16 = /boot
          # Any failure once writing starts zeroes the first 64 MiB and last 1 MiB.
          - name: stream-ubuntu-image
            image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            timeout: 900
            environment:
              BASE_URL: https://cloud-images.ubuntu.com/noble/20261017
              IMG: noble-server-cloudimg-amd64.img
              SHA256: 04e8f2461a16a44e78a370284471f29616cdd9baf1893df25807b71f985b6c94
            command: ["/bin/sh", "-c", "set -e; apk add --no-cache qemu-img curl; cd /tmp; curl -fL --retry 3 -o $IMG $BASE_URL/$IMG; echo \"$SHA256  $IMG\" | sha256sum -c -; inval() { echo invalidating /dev/sda; N=$(blockdev --getsz /dev/sda); dd if=/dev/zero of=/dev/sda bs=1M count=64 conv=fsync 2>/dev/null; dd if=/dev/zero of=/dev/sda bs=512 seek=$((N-2048)) count=2048 conv=fsync 2>/dev/null; }; OK=0; trap 'rc=$?; set +e; [ $OK = 1 ] || inval; exit $rc' EXIT; qemu-img convert -p -n -f qcow2 -O raw $IMG /dev/sda; sync; OK=1; rm -f $IMG"]
          # CRITICAL: Refresh partition table using nsenter to run in host mount namespace
          # Using justincormack/nsenter1 - a minimal image designed specifically for this purpose
          # partprobe must succeed, and each partition later steps use must exist with
          # the kernel's start/size matching the newly written GPT (no stale mappings).
          # Busybox only (HookOS has no parted/udevadm): the GPT is read with dd/od.
          - name: partition-refresh
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 60
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "set -e; partprobe /dev/sda; udevadm settle 2>/dev/null || sleep 2; ls -la /dev/sda*; [ \"$(blockdev --getss /dev/sda)\" = 512 ] || { echo 'logical sector size is not 512'; exit 1; }; [ \"$(dd if=/dev/sda bs=8 skip=64 count=1 2>/dev/null)\" = 'EFI PART' ] || { echo 'no primary GPT on /dev/sda'; exit 1; }; u64() { set -- $(od -A n -t u4 -j $1 -N 8 /dev/sda); echo $(( $1 + ($2 << 32) )); }; u32() { set -- $(od -A n -t u4 -j $1 -N 4 /dev/sda); echo $1; }; E=$(( $(u64 584) * 512 )); Z=$(u32 596); for p in 1 15 16; do test -b /dev/sda$p || { echo /dev/sda$p missing; exit 1; }; f=$(u64 $((E + (p - 1) * Z + 32))); l=$(u64 $((E + (p - 1) * Z + 40))); [ $f -gt 0 ] || { echo \"sda$p: no GPT entry\"; exit 1; }; w=\"$f $((l - f + 1))\"; d=$(stat -L -c '%t:%T' /dev/sda$p); y=/sys/dev/block/$((0x${d%:*})):$((0x${d#*:})); k=\"$(cat $y/start) $(cat $y/size)\"; [ \"$k\" = \"$w\" ] || { echo \"sda$p: kernel start/size $k != on-disk GPT $w (stale partition table)\"; exit 1; }; echo \"sda$p ok: $k\"; done"]
          # Clear cloud-init state so it runs fresh on first boot with new instance-id/hostname
          # Idempotent: unmounts first if already mounted, handles missing dirs gracefully
          - name: reset-cloud-init-state
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 120
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; rm -rf /mnt/var/lib/cloud/instances/* /mnt/var/lib/cloud/instance /mnt/var/lib/cloud/data/*; rm -f /mnt/etc/machine-id; echo uninitialized > /mnt/etc/machine-id; sync"]
          - name: write-netplan
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /etc/netplan/50-cloud-init.yaml
              CONTENTS: |
                network:
                  version: 2
                  ethernets:
                    ens160:
                      dhcp4: false
                      dhcp6: false
                      addresses:
                        - 108.181.38.85/27
                      routes:
                        - to: 0.0.0.0/0
                          via: 108.181.38.65
                      nameservers:
                        addresses:
                          - 8.8.8.8
                          - 8.8.4.4
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-meta
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/meta-data
              CONTENTS: |
                instance-id: {{.device_1}}
                local-hostname: {{.hostname}}
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-user
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/user-data
              CONTENTS: |
                #cloud-config
                hostname: {{.hostname}}
                manage_etc_hosts: true
                users:
                  - name: ubuntu
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    lock_passwd: true
                    ssh_authorized_keys:
                      - ssh-rsa  kevin
                      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIND/fC/qBE102c4RLsxdto+62Zaq4KdlqSQwpuWR9wcC ubuntu@metal-foundry-control
                # Key-only SSH. No passwords here: this repo is public, so any hash is crackable offline.
                ssh_pwauth: false
                package_update: true
                package_upgrade: true
                packages:
                  - qemu-guest-agent
                  - curl
                  - vim
                runcmd:
                  - systemctl enable qemu-guest-agent
                  - systemctl start qemu-guest-agent
                  # Tinkerbell provisioning marker - proves this is a fresh install
                  - echo "tinkerbell_provisioned=$(date +%s)" > /var/lib/tinkerbell-provisioned
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          # Install GRUB for UEFI. /boot is its own partition (sda16) on 24.04 cloud
          # images; it must be mounted or update-grub writes a grub.cfg the booted
          # system never sees. --removable installs the UEFI fallback /EFI/BOOT/BOOTX64.EFI.
          - name: install-grub-uefi
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 180
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; mount /dev/sda16 /mnt/boot; mkdir -p /mnt/boot/efi; mount /dev/sda15 /mnt/boot/efi; mount --bind /dev /mnt/dev; mount --bind /proc /mnt/proc; mount --bind /sys /mnt/sys; chroot /mnt grub-install --target=x86_64-efi --efi-directory=/boot/efi --removable; chroot /mnt update-grub; sync"]
          # waitdaemon reports SUCCESS to tink-server first, then reboots WAIT_SECONDS later
          # from a detached container. The Workflow reaches SUCCESS, so the controller's
          # Post step (toggleAllowNetboot) sets allowPXE=false and the next boot is from disk.
          # A synchronous `reboot -f` killed HookOS before reporting and left it RUNNING.
          # WAIT_SECONDS is margin for the final status report, not a handshake.
          - name: reboot-into-os
            image: ghcr.io/jacobweinstock/waitdaemon:0.4.3@sha256:8535eca0df48bb46f523b6a3ec3d9fff925212777f1a2be56436a62495ee1e79
            timeout: 90
            pid: host
            command: ["/bin/sh", "-c", "sync && reboot -f"]
            environment:
              IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
              WAIT_SECONDS: "30"
              CONTAINER_RUNTIME: docker
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
---
# Ubuntu 24.04 LTS Installation Template for anvil (Dell R610)
# Uses nsenter to refresh the partition table after writing the image (fixes mount failures)
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: anvil-ubuntu-2404
  namespace: tink-system
spec:
  data: |
    version: "0.1"
    name: anvil-ubuntu-2404
    global_timeout: 1800
    tasks:
      - name: os-installation
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
          - /lib/firmware:/lib/firmware:ro
        actions:
          # Custom Ubuntu 24.04 image with bnx2 firmware pre-installed, served by .67.
          # Layout: sda1 = root, sda14 = BIOS boot, sda15 = EFI, sda16 = /boot
          # SHA256 of the file as served on 2026-10-30. If the image is rebuilt,
          # update SHA256 (sha256sum /var/www/html/noble-bnx2.raw.gz on .67).
          # Streams straight to disk (2.3 GB gz, 5.5 GiB raw: too big for HookOS RAM)
          # and hashes the same bytes on the way. No curl --retry: a retry would resend
          # from byte 0 into the same pipe. Any failure once writing starts (download,
          # gzip error, write, checksum mismatch) zeroes the first 64 MiB and the last
          # 1 MiB of the disk and fails the action.
          - name: stream-ubuntu-image
            image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            timeout: 900
            environment:
              IMG_URL: http://108.181.38.67:8081/noble-bnx2.raw.gz
              SHA256: b0eefcc27e0e42762890b116b274bb17960b280b554b163cf69ba81b84f2e0ab
            command: ["/bin/sh", "-c", "set -eu -o pipefail; apk add --no-cache curl; mkfifo /tmp/img.fifo; inval() { echo invalidating /dev/sda; N=$(blockdev --getsz /dev/sda); dd if=/dev/zero of=/dev/sda bs=1M count=64 conv=fsync 2>/dev/null; dd if=/dev/zero of=/dev/sda bs=512 seek=$((N-2048)) count=2048 conv=fsync 2>/dev/null; }; OK=0; trap 'rc=$?; set +e; [ $OK = 1 ] || inval; exit $rc' EXIT; sha256sum < /tmp/img.fifo > /tmp/img.sum & H=$!; curl -fsSL $IMG_URL | tee /tmp/img.fifo | gunzip -c | dd of=/dev/sda bs=4M conv=fsync; wait $H; read -r GOT _ < /tmp/img.sum; [ \"$GOT\" = \"$SHA256\" ] || { echo \"SHA256 mismatch: got $GOT want $SHA256\"; exit 1; }; echo \"SHA256 OK $GOT\"; sync; OK=1"]
          # CRITICAL: Refresh partition table using nsenter to run in host mount namespace
          # partprobe must succeed, and each partition later steps use must exist with
          # the kernel's start/size matching the newly written GPT (no stale mappings).
          # Busybox only (HookOS has no parted/udevadm): the GPT is read with dd/od.
          - name: partition-refresh
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 60
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "set -e; partprobe /dev/sda; udevadm settle 2>/dev/null || sleep 2; ls -la /dev/sda*; [ \"$(blockdev --getss /dev/sda)\" = 512 ] || { echo 'logical sector size is not 512'; exit 1; }; [ \"$(dd if=/dev/sda bs=8 skip=64 count=1 2>/dev/null)\" = 'EFI PART' ] || { echo 'no primary GPT on /dev/sda'; exit 1; }; u64() { set -- $(od -A n -t u4 -j $1 -N 8 /dev/sda); echo $(( $1 + ($2 << 32) )); }; u32() { set -- $(od -A n -t u4 -j $1 -N 4 /dev/sda); echo $1; }; E=$(( $(u64 584) * 512 )); Z=$(u32 596); for p in 1 14 16; do test -b /dev/sda$p || { echo /dev/sda$p missing; exit 1; }; f=$(u64 $((E + (p - 1) * Z + 32))); l=$(u64 $((E + (p - 1) * Z + 40))); [ $f -gt 0 ] || { echo \"sda$p: no GPT entry\"; exit 1; }; w=\"$f $((l - f + 1))\"; d=$(stat -L -c '%t:%T' /dev/sda$p); y=/sys/dev/block/$((0x${d%:*})):$((0x${d#*:})); k=\"$(cat $y/start) $(cat $y/size)\"; [ \"$k\" = \"$w\" ] || { echo \"sda$p: kernel start/size $k != on-disk GPT $w (stale partition table)\"; exit 1; }; echo \"sda$p ok: $k\"; done"]
          # Clear cloud-init state so it runs fresh on first boot with new instance-id/hostname
          # Idempotent: unmounts first if already mounted, handles missing dirs gracefully
          - name: reset-cloud-init-state
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 120
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; rm -rf /mnt/var/lib/cloud/instances/* /mnt/var/lib/cloud/instance /mnt/var/lib/cloud/data/*; rm -f /mnt/etc/machine-id; echo uninitialized > /mnt/etc/machine-id; sync"]
          - name: write-netplan
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /etc/netplan/50-cloud-init.yaml
              CONTENTS: |
                network:
                  version: 2
                  ethernets:
                    eno1:
                      dhcp4: false
                      dhcp6: false
                      addresses:
                        - 108.181.38.87/27
                      routes:
                        - to: 0.0.0.0/0
                          via: 108.181.38.65
                      nameservers:
                        addresses:
                          - 8.8.8.8
                          - 8.8.4.4
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-meta
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/meta-data
              CONTENTS: |
                instance-id: {{.device_1}}
                local-hostname: {{.hostname}}
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-user
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/user-data
              CONTENTS: |
                #cloud-config
                hostname: {{.hostname}}
                manage_etc_hosts: true
                users:
                  - name: kevin
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    lock_passwd: true
                    ssh_authorized_keys:
                      - ssh-rsa  kevin
                      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIND/fC/qBE102c4RLsxdto+62Zaq4KdlqSQwpuWR9wcC ubuntu@metal-foundry-control
                # Key-only SSH. No passwords here: this repo is public, so any hash is crackable offline.
                ssh_pwauth: false
                package_update: true
                package_upgrade: true
                packages:
                  - qemu-guest-agent
                  - curl
                  - vim
                runcmd:
                  - systemctl enable qemu-guest-agent
                  - systemctl start qemu-guest-agent
                  # Remove the stock ubuntu user that came baked into the image.
                  # `users:` block above defines `kevin` as the primary account; the
                  # ubuntu user from noble-bnx2.raw.gz is unused after this point.
                  - userdel -r ubuntu 2>/dev/null || true
                  # Tinkerbell provisioning marker - proves this is a fresh install
                  - echo "tinkerbell_provisioned=$(date +%s)" > /var/lib/tinkerbell-provisioned
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          # Install Broadcom bnx2 firmware for Dell R610 NICs
          # Copy firmware from HookOS (which has it) and regenerate initramfs
          # This avoids network dependency during provisioning
          # Ubuntu cloud images have kernel on sda16 (boot partition), must mount to /boot
          # Idempotent: cleans up mounts before starting, handles missing firmware gracefully
          - name: install-bnx2-firmware
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 180
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; mount /dev/sda16 /mnt/boot; if ls /lib/firmware/bnx2/* >/dev/null 2>&1; then mkdir -p /mnt/lib/firmware/bnx2; cp -v /lib/firmware/bnx2/* /mnt/lib/firmware/bnx2/; else echo 'No bnx2 firmware in HookOS'; fi; mount --bind /dev /mnt/dev; mount --bind /proc /mnt/proc; mount --bind /sys /mnt/sys; chroot /mnt update-initramfs -u -k all; sync"]
          # Install GRUB bootloader for BIOS/MBR using nsenter
          # --target=i386-pc is explicit: without it grub-install picks the platform of
          # however HookOS itself booted (x86_64-efi on a UEFI boot) and fails or
          # installs the wrong loader.
          # Must bind mount /dev, /proc, /sys for grub-install to detect disk properly
          # Ubuntu cloud images have kernel on sda16 (boot partition), must mount to /boot
          # Idempotent: cleans up mounts before starting
          - name: install-grub
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 180
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; mount /dev/sda16 /mnt/boot; mount --bind /dev /mnt/dev; mount --bind /proc /mnt/proc; mount --bind /sys /mnt/sys; chroot /mnt grub-install --target=i386-pc /dev/sda; chroot /mnt update-grub; sync"]
          # waitdaemon reports SUCCESS to tink-server first, then reboots WAIT_SECONDS later
          # from a detached container. The Workflow reaches SUCCESS, so the controller's
          # Post step (toggleAllowNetboot) sets allowPXE=false and the next boot is from disk.
          # A synchronous `reboot -f` killed HookOS before reporting and left it RUNNING.
          # WAIT_SECONDS is margin for the final status report, not a handshake.
          - name: reboot-into-os
            image: ghcr.io/jacobweinstock/waitdaemon:0.4.3@sha256:8535eca0df48bb46f523b6a3ec3d9fff925212777f1a2be56436a62495ee1e79
            timeout: 90
            pid: host
            command: ["/bin/sh", "-c", "sync && reboot -f"]
            environment:
              IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
              WAIT_SECONDS: "30"
              CONTAINER_RUNTIME: docker
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
---
# Ubuntu 26.04 LTS (Resolute Raccoon) Installation Template, legacy BIOS servers
# hardwareMap keys: device_1 (MAC), hostname, ip_address (CIDR, in 108.181.38.64/27)
# Canonical only publishes 26.04 cloud images as qcow2, so this streams the
# official image and converts it straight onto the disk instead of image2disk.
# Partition layout of resolute-server-cloudimg-amd64.img (differs from 24.04):
#   sda1 = root (ext4), sda13 = /boot (ext4), sda14 = BIOS boot, sda15 = EFI
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: ubuntu-2604-bios
  namespace: tink-system
spec:
  data: |
    version: "0.1"
    name: ubuntu-2604-bios
    global_timeout: 2400
    tasks:
      - name: os-installation
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
          - /lib/firmware:/lib/firmware:ro
        actions:
          # Download the pinned dated build, verify its SHA256, then write raw to disk.
          # To move to a newer build: change BASE_URL and SHA256 together (from that
          # directory's SHA256SUMS).
          # -n: target is an existing block device, so qemu-img writes zeros explicitly
          # Any failure once writing starts zeroes the first 64 MiB and last 1 MiB.
          - name: stream-ubuntu-image
            image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
            timeout: 900
            environment:
              BASE_URL: https://cloud-images.ubuntu.com/resolute/20261016
              IMG: resolute-server-cloudimg-amd64.img
              SHA256: 5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5
            command: ["/bin/sh", "-c", "set -e; apk add --no-cache qemu-img curl; cd /tmp; curl -fL --retry 3 -o $IMG $BASE_URL/$IMG; echo \"$SHA256  $IMG\" | sha256sum -c -; inval() { echo invalidating /dev/sda; N=$(blockdev --getsz /dev/sda); dd if=/dev/zero of=/dev/sda bs=1M count=64 conv=fsync 2>/dev/null; dd if=/dev/zero of=/dev/sda bs=512 seek=$((N-2048)) count=2048 conv=fsync 2>/dev/null; }; OK=0; trap 'rc=$?; set +e; [ $OK = 1 ] || inval; exit $rc' EXIT; qemu-img convert -p -n -f qcow2 -O raw $IMG /dev/sda; sync; OK=1; rm -f $IMG"]
          # CRITICAL: Refresh partition table using nsenter to run in host mount namespace
          # partprobe must succeed, and each partition later steps use must exist with
          # the kernel's start/size matching the newly written GPT (no stale mappings).
          # Busybox only (HookOS has no parted/udevadm): the GPT is read with dd/od.
          - name: partition-refresh
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 60
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "set -e; partprobe /dev/sda; udevadm settle 2>/dev/null || sleep 2; ls -la /dev/sda*; [ \"$(blockdev --getss /dev/sda)\" = 512 ] || { echo 'logical sector size is not 512'; exit 1; }; [ \"$(dd if=/dev/sda bs=8 skip=64 count=1 2>/dev/null)\" = 'EFI PART' ] || { echo 'no primary GPT on /dev/sda'; exit 1; }; u64() { set -- $(od -A n -t u4 -j $1 -N 8 /dev/sda); echo $(( $1 + ($2 << 32) )); }; u32() { set -- $(od -A n -t u4 -j $1 -N 4 /dev/sda); echo $1; }; E=$(( $(u64 584) * 512 )); Z=$(u32 596); for p in 1 13 14; do test -b /dev/sda$p || { echo /dev/sda$p missing; exit 1; }; f=$(u64 $((E + (p - 1) * Z + 32))); l=$(u64 $((E + (p - 1) * Z + 40))); [ $f -gt 0 ] || { echo \"sda$p: no GPT entry\"; exit 1; }; w=\"$f $((l - f + 1))\"; d=$(stat -L -c '%t:%T' /dev/sda$p); y=/sys/dev/block/$((0x${d%:*})):$((0x${d#*:})); k=\"$(cat $y/start) $(cat $y/size)\"; [ \"$k\" = \"$w\" ] || { echo \"sda$p: kernel start/size $k != on-disk GPT $w (stale partition table)\"; exit 1; }; echo \"sda$p ok: $k\"; done"]
          # Clear cloud-init state so it runs fresh on first boot with new instance-id/hostname
          # Idempotent: unmounts first if already mounted, handles missing dirs gracefully
          - name: reset-cloud-init-state
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 120
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; rm -rf /mnt/var/lib/cloud/instances/* /mnt/var/lib/cloud/instance /mnt/var/lib/cloud/data/*; rm -f /mnt/etc/machine-id; echo uninitialized > /mnt/etc/machine-id; sync"]
          - name: write-netplan
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /etc/netplan/50-cloud-init.yaml
              CONTENTS: |
                network:
                  version: 2
                  ethernets:
                    uplink:
                      match:
                        macaddress: "{{.device_1}}"
                      dhcp4: false
                      dhcp6: false
                      addresses:
                        - {{.ip_address}}
                      routes:
                        - to: 0.0.0.0/0
                          via: 108.181.38.65
                      nameservers:
                        addresses:
                          - 8.8.8.8
                          - 8.8.4.4
              UID: "0"
              GID: "0"
              MODE: "0600"
              DIRMODE: "0755"
          # Keep cloud-init from regenerating netplan with fallback DHCP on first boot
          - name: disable-cloud-init-network
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
              CONTENTS: |
                network: {config: disabled}
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-meta
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/meta-data
              CONTENTS: |
                instance-id: {{.device_1}}
                local-hostname: {{.hostname}}
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          - name: write-cloud-init-user
            image: quay.io/tinkerbell/actions/writefile@sha256:f9e05eae1f073dc4dd1198f186c0a0f99de1a3aa3b53a6eac3d2e08053271fba
            timeout: 90
            environment:
              DEST_DISK: /dev/sda1
              FS_TYPE: ext4
              DEST_PATH: /var/lib/cloud/seed/nocloud/user-data
              CONTENTS: |
                #cloud-config
                hostname: {{.hostname}}
                manage_etc_hosts: true
                users:
                  - name: kevin
                    sudo: ALL=(ALL) NOPASSWD:ALL
                    shell: /bin/bash
                    lock_passwd: true
                    ssh_authorized_keys:
                      - ssh-rsa  kevin
                      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIND/fC/qBE102c4RLsxdto+62Zaq4KdlqSQwpuWR9wcC ubuntu@metal-foundry-control
                # Key-only SSH. No passwords here: this repo is public, so any hash is crackable offline.
                ssh_pwauth: false
                package_update: true
                package_upgrade: true
                packages:
                  - curl
                  - vim
                runcmd:
                  # Remove the stock ubuntu user that came baked into the cloud image.
                  - userdel -r ubuntu 2>/dev/null || true
                  # Tinkerbell provisioning marker - proves this is a fresh install
                  - echo "tinkerbell_provisioned=$(date +%s)" > /var/lib/tinkerbell-provisioned
              UID: "0"
              GID: "0"
              MODE: "0644"
              DIRMODE: "0755"
          # Copy Broadcom bnx2 firmware from HookOS (no-op if the NIC doesn't need it) and
          # regenerate initramfs. /boot is sda13 on 26.04 cloud images.
          - name: install-bnx2-firmware
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 180
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; mount /dev/sda13 /mnt/boot; if ls /lib/firmware/bnx2/* >/dev/null 2>&1; then mkdir -p /mnt/lib/firmware/bnx2; cp -v /lib/firmware/bnx2/* /mnt/lib/firmware/bnx2/; else echo 'No bnx2 firmware in HookOS'; fi; mount --bind /dev /mnt/dev; mount --bind /proc /mnt/proc; mount --bind /sys /mnt/sys; chroot /mnt update-initramfs -u -k all; sync"]
          # Install GRUB for legacy BIOS (server boot mode is BIOS; image has BIOS boot partition sda14)
          # Fails the action on error instead of masking it with a trailing `|| true`
          - name: install-grub
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 180
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "cleanup() { sync; for m in $(awk '$2 ~ \"^/mnt(/|$)\" {print $2}' /proc/mounts | sort -r); do umount $m 2>/dev/null || umount -l $m; done; awk '$2 ~ \"^/mnt(/|$)\" {f=1} END {exit (f ? 1 : 0)}' /proc/mounts; }; cleanup || { echo stale mounts under /mnt; exit 1; }; set -e; trap 'rc=$?; set +e; cleanup || { echo unmount failed; [ $rc -ne 0 ] || rc=1; }; exit $rc' EXIT; mount /dev/sda1 /mnt; mount /dev/sda13 /mnt/boot; mount --bind /dev /mnt/dev; mount --bind /proc /mnt/proc; mount --bind /sys /mnt/sys; chroot /mnt grub-install --target=i386-pc /dev/sda; chroot /mnt update-grub; sync"]
          # waitdaemon reports SUCCESS to tink-server first, then reboots WAIT_SECONDS later
          # from a detached container. The Workflow reaches SUCCESS, so the controller's
          # Post step (toggleAllowNetboot) sets allowPXE=false and the next boot is from disk.
          # A synchronous `reboot -f` killed HookOS before reporting and left it RUNNING.
          # WAIT_SECONDS is margin for the final status report, not a handshake.
          - name: reboot-into-os
            image: ghcr.io/jacobweinstock/waitdaemon:0.4.3@sha256:8535eca0df48bb46f523b6a3ec3d9fff925212777f1a2be56436a62495ee1e79
            timeout: 90
            pid: host
            command: ["/bin/sh", "-c", "sync && reboot -f"]
            environment:
              IMAGE: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
              WAIT_SECONDS: "30"
              CONTAINER_RUNTIME: docker
            volumes:
              - /var/run/docker.sock:/var/run/docker.sock
---
# Harvester HCI v1.6.1 Installation Template
# Downloads Harvester kernel/initrd and kexec's into the installer
# Harvester's installer handles disk partitioning and installation
apiVersion: tinkerbell.org/v1alpha1
kind: Template
metadata:
  name: harvester
  namespace: tink-system
spec:
  data: |
    version: "0.1"
    name: harvester
    global_timeout: 1800
    tasks:
      - name: harvester-installation
        worker: "{{.device_1}}"
        volumes:
          - /dev:/dev
          - /dev/console:/dev/console
          - /lib/firmware:/lib/firmware:ro
        actions:
          # Install kexec-tools using Alpine apk (HookOS is Alpine-based)
          # Must use full path /sbin/apk since nsenter may not have /sbin in PATH
          - name: install-kexec-tools
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 120
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "/sbin/apk add --no-cache kexec-tools && /usr/sbin/kexec --version"]
          # Download Harvester kernel and initrd (custom initrd with bnx2 firmware for Dell R610)
          # and verify them. The rootfs and install config are fetched again by the
          # installer itself (root=live:, config_url), so they can only be checked here,
          # just before kexec; that narrows but does not close the window.
          # Hashes are of the files on .67 as of 2026-10-30; update them with the files.
          - name: download-harvester-files
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 600
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "set -e; mkdir -p /tmp/harvester; cd /tmp/harvester; wget -q http://108.181.38.67:8081/harvester/harvester-v1.6.1-vmlinuz-amd64 -O vmlinuz; wget -q http://108.181.38.67:8081/harvester/harvester-v1.6.1-initrd-bnx2-amd64 -O initrd; printf '%s  %s\\n' cc7d6bd09d50895d326e5c9f7814d58d7c51d420e29d87089d22e35fdaf354a1 vmlinuz db1f2dc141a5446ebaedf99828fe2aae4a0e3f11d1dd690e566d655115ed4e5a initrd | sha256sum -c -; R=$(wget -qO- http://108.181.38.67:8081/harvester/harvester-v1.6.1-rootfs-bnx2-amd64.squashfs | sha256sum | cut -d' ' -f1); [ $R = 03c84204d33c7b394f9664bdda5b1e789b0398f66f9ea0d6485555179ed0ae10 ] || { echo rootfs SHA256 mismatch: $R; exit 1; }; C=$(wget -qO- http://108.181.38.67:8081/harvester/config-create.yaml | sha256sum | cut -d' ' -f1); [ $C = 27caabf1fb616e0a63afc7d4faa44b07998ac18787bc7c1c83641353576c1e3e ] || { echo config SHA256 mismatch: $C; exit 1; }; ls -la /tmp/harvester/"]
          # Kexec into Harvester installer
          # The kernel cmdline tells Harvester where to get rootfs and config
          # Using static IP because DHCP times out before dracut can fetch rootfs
          # Format: ip=<client-ip>::<gateway>:<netmask>:<hostname>:<device>:none
          # Using eth0 (traditional naming) - more reliable for Dell R610 Broadcom NICs
          - name: kexec-harvester
            image: justincormack/nsenter1@sha256:e876f694a4cb6ff9e6861197ea3680fe2e3c5ab773a1e37ca1f13171f7f5798e
            timeout: 60
            pid: host
            command: ["/usr/bin/nsenter", "-t", "1", "-m", "-u", "-i", "-n", "--", "/bin/sh", "-c", "kexec -l /tmp/harvester/vmlinuz --initrd=/tmp/harvester/initrd --command-line='ip=108.181.38.87::108.181.38.65:255.255.255.224:anvil:eth0:none net.ifnames=0 biosdevname=0 pci=nomsi rd.cos.disable rd.noverifyssl console=tty1 root=live:http://108.181.38.67:8081/harvester/harvester-v1.6.1-rootfs-bnx2-amd64.squashfs harvester.install.automatic=true harvester.install.config_url=http://108.181.38.67:8081/harvester/config-create.yaml harvester.install.skipchecks=true' && kexec -e"]
