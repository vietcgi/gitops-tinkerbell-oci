---
# Hardware definition for colo-server-01 (existing VM)
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: colo-server-01
  namespace: tink-system
spec:
  disks:
    - device: /dev/sda
  interfaces:
    - dhcp:
        arch: x86_64
        hostname: colo-server-01
        ip:
          address: 108.181.38.85
          gateway: 108.181.38.65
          netmask: 255.255.255.224
        mac: 00:0c:29:73:03:4b
        uefi: true
      netboot:
        allowPXE: false
        allowWorkflow: false
      disableDhcp: false
  metadata:
    facility:
      facility_code: colo
    instance:
      hostname: colo-server-01
---
# Hardware definition for anvil (Dell R610)
# MAC: 00:21:9b:a1:dc:c0 - discovered from DHCP logs
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: anvil
  namespace: tink-system
spec:
  disks:
    - device: /dev/sda
  interfaces:
    - dhcp:
        arch: x86_64
        hostname: anvil
        ip:
          address: 108.181.38.87
          gateway: 108.181.38.65
          netmask: 255.255.255.224
        mac: 00:21:9b:a1:dc:c0
        uefi: false
      netboot:
        # Default false; the anvil-ubuntu Workflow uses
        # bootOptions.toggleAllowNetboot to flip this to true during install
        # and back to false on workflow success, so we don't loop into HookOS
        # on every boot after install.
        allowPXE: false
      disableDhcp: false
  metadata:
    facility:
      facility_code: colo
    instance:
      hostname: anvil
---
# Hardware definition for forge (second Dell R610, svc tag 36QVVH?)
# MAC: f0:4d:a2:0a:51:cb - from PXE console 2026-10-30
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: forge
  namespace: tink-system
spec:
  disks:
    - device: /dev/sda
  interfaces:
    - dhcp:
        arch: x86_64
        hostname: forge
        ip:
          address: 108.181.38.86
          gateway: 108.181.38.65
          netmask: 255.255.255.224
        mac: f0:4d:a2:0a:51:cb
        uefi: false
      netboot:
        # Installed Ubuntu 26.04 on 2026-10-30. Keep false so reboots boot from disk;
        # to reinstall, add a new uniquely named Workflow (toggleAllowNetboot: true)
        allowPXE: false
      disableDhcp: false
  metadata:
    facility:
      facility_code: colo
    instance:
      hostname: forge
---
# Hardware definition for hammer (third Dell R610, svc tag 47QVVH2)
# MAC: 00:21:9b:a4:ef:6f - from PXE console 2026-10-30
apiVersion: tinkerbell.org/v1alpha1
kind: Hardware
metadata:
  name: hammer
  namespace: tink-system
spec:
  disks:
    - device: /dev/sda
  interfaces:
    - dhcp:
        arch: x86_64
        hostname: hammer
        ip:
          address: 108.181.38.69
          gateway: 108.181.38.65
          netmask: 255.255.255.224
        mac: 00:21:9b:a4:ef:6f
        uefi: false
      netboot:
        # TRUE only while installing. Flux re-applies this every hour and would
        # overwrite the Workflow's toggleAllowNetboot. Set back to false after install.
        allowPXE: true
      disableDhcp: false
  metadata:
    facility:
      facility_code: colo
    instance:
      hostname: hammer
