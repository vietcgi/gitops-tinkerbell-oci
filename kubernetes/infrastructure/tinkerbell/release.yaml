---
# Tinkerbell Namespace
# Using tink-system as per Tinkerbell convention
apiVersion: v1
kind: Namespace
metadata:
  name: tink-system
  labels:
    app.kubernetes.io/name: tinkerbell
---
# Tinkerbell Helm Release (unified chart)
#
# Architecture: iPXE chainloading over HTTPS
# - Control plane on OCI cloud
# - Bare metal at home lab / colo sites
# - Local DHCP points to https://tinkerbell.qualityspace.com/auto.ipxe
# - Rufio controls BMC (iDRAC/IPMI) via network
#
# Components enabled:
# - Smee: iPXE server (DHCP disabled - sites have their own)
# - Tink Server & Controller: Workflow engine
# - Rufio: BMC controller for iDRAC/Supermicro IPMI
# - Tootles: Artifact server for HookOS
#
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tinkerbell
  namespace: tink-system
spec:
  interval: 1h
  chart:
    spec:
      chart: tinkerbell
      version: "v0.25.0"
      sourceRef:
        kind: HelmRepository
        name: tinkerbell
        namespace: flux-system
  values:
    # Public IP for syslog and other services
    # Note: gRPC endpoint is overridden via ipxeHttpScriptExtraKernelArgs
    publicIP: "170.9.8.103"

    # Trusted proxies (Cilium pod CIDR)
    trustedProxies:
      - "10.42.0.0/16"

    # HookOS artifacts URL - served via Gateway API
    # Uses HTTP because iPXE binary doesn't have HTTPS support compiled in
    # hookos.qualityspace.com (DNS-only in Cloudflare, not proxied)
    artifactsFileServer: "http://hookos.qualityspace.com"

    # Deployment configuration
    deployment:
      replicas: 1
      # Don't use hostNetwork - we're behind Gateway API
      hostNetwork: false

      # Feature flags
      envs:
        globals:
          # Enable all required components
          enableSmee: true
          enableTinkServer: true
          enableTinkController: true
          enableRufioController: true
          enableTootles: true
          # Disable SSH bastion (secondstar)
          enableSecondstar: false


        smee:
          # DHCP off: the colo boot host (.67, isc-dhcp) hands out IPs and the
          # boot filename. Smee runs as a ClusterIP pod in OCI and never saw a
          # DHCP packet (dhcp_total all 0). Script/binary HTTP serving is separate.
          dhcpEnabled: false
          # Serve the iPXE script at /ipxe/script/<mac>/auto.ipxe (chart default true).
          # The old keys httpIpxeScriptEnabled/httpIpxeScriptUrl were never chart
          # values and were silently ignored.
          ipxeHttpScriptEnabled: true
          # gRPC endpoint for HookOS tink-agent. tink-server has no client auth and
          # picks work by the caller-supplied agent ID, so it must not be public:
          # port 42113 is a dedicated Gateway listener and the OCI security list only
          # admits the colo /27 on it (terraform/modules/vcn). Plain HTTP (h2c):
          # Cilium HTTPS listeners don't negotiate ALPN for gRPC (cilium#30794).
          # Overridden via extra kernel args since publicIP must be an IP.
          ipxeHttpScriptExtraKernelArgs:
            - "grpc_authority=tinkerbell.qualityspace.com:42113"
            - "tink_ssh_authorized_"


      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 1000m
          memory: 512Mi

    # Service configuration - use ClusterIP since we're behind Gateway API
    service:
      type: ClusterIP

    # Optional components
    optional:
      # HookOS - in-memory provisioning OS
      hookos:
        enabled: true
        downloadURL: "https://github.com/tinkerbell/hook/releases/download/v0.11.1"
        # Use ClusterIP - served via Gateway API at hookos.qualityspace.com
        service:
          type: ClusterIP
        # Persistence path: chart default is /tmp which systemd-tmpfiles cleans
        # daily, wiping the extracted vmlinuz/initramfs and breaking PXE boot for
        # any node that doesn't trigger a pod restart in time. Pin to a stable
        # location under /var/lib that systemd-tmpfiles never touches.
        persistence:
          localPersistentVolume:
            path: /var/lib/hookos
      # Disable kubevip - using Cilium L2 announcements
      kubevip:
        enabled: false

  # Post-render patches for service appProtocol
  postRenderers:
    - kustomize:
        patches:
          # hookos: HTTP/1.1 (nginx doesn't support HTTP/2)
          - target:
              kind: Service
              name: hookos
            patch: |
              - op: add
                path: /spec/ports/0/appProtocol
                value: http
          # tinkerbell: gRPC uses HTTP/2 plaintext (h2c)
          # Port order since v0.23: dhcp, tftp, syslog, grpc, http. The test op
          # fails the render if the order changes, instead of patching the wrong port.
          - target:
              kind: Service
              name: tinkerbell
            patch: |
              - op: test
                path: /spec/ports/3/name
                value: grpc
              - op: add
                path: /spec/ports/3/appProtocol
                value: kubernetes.io/h2c
---
# HTTPRoute for HookOS artifacts (kernel, initramfs) - HTTPS
# Served at hookos.qualityspace.com (DNS-only in Cloudflare)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hookos-route
  namespace: tink-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - hookos.qualityspace.com
  rules:
    - backendRefs:
        - name: hookos
          port: 7173
---
# HTTPRoute for HookOS artifacts - HTTP (for iPXE which doesn't support TLS 1.3)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hookos-http
  namespace: tink-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http
  hostnames:
    - hookos.qualityspace.com
  rules:
    - backendRefs:
        - name: hookos
          port: 7173
---
# HTTPRoute for Tinkerbell services
# TLS handled by wildcard cert in ingress namespace
# Routes traffic from main-gateway to Tinkerbell
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tinkerbell-route
  namespace: tink-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - tinkerbell.qualityspace.com
  rules:
    # iPXE auto script - this is what DHCP points to
    # Rewrite /auto.ipxe to /ipxe/script/auto.ipxe for Smee
    - matches:
        - path:
            type: Exact
            value: /auto.ipxe
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ipxe/script/auto.ipxe
      backendRefs:
        - name: tinkerbell
          port: 7080
    # Smee HTTP endpoints
    - matches:
        - path:
            type: PathPrefix
            value: /ipxe
      backendRefs:
        - name: tinkerbell
          port: 7080
---
# GRPCRoute for Tink Server gRPC API
# tink-agent in HookOS connects here to get workflows. Attached only to the
# colo-restricted tinkerbell-grpc listener (42113), never to the public :80/:443.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: tinkerbell-grpc
  namespace: tink-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: tinkerbell-grpc
  hostnames:
    - tinkerbell.qualityspace.com
  rules:
    - backendRefs:
        - name: tinkerbell
          port: 42113
---
# HTTP Route for Tinkerbell iPXE endpoints (no redirect for iPXE)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tinkerbell-http
  namespace: tink-system
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http
  hostnames:
    - tinkerbell.qualityspace.com
  rules:
    # iPXE auto script - serve directly over HTTP (iPXE TLS issues)
    - matches:
        - path:
            type: Exact
            value: /auto.ipxe
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ipxe/script/auto.ipxe
      backendRefs:
        - name: tinkerbell
          port: 7080
    # iPXE endpoints - serve directly over HTTP
    - matches:
        - path:
            type: PathPrefix
            value: /ipxe
      backendRefs:
        - name: tinkerbell
          port: 7080
    # Note: No catch-all redirect - gRPC traffic needs to reach GRPCRoute on HTTP
