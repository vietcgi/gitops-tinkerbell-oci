---
# Install lifecycle (one Workflow per host in Git):
#   1. To install/reinstall: give the host's Workflow a NEW name and set
#      `disabled: false`. Rename rather than add: tink-server stops at the first
#      non-pending Workflow for an agent, so a leftover one can block the install.
#   2. Reboot the host. waitdaemon reports SUCCESS, toggleAllowNetboot turns PXE off.
#   3. After SUCCESS, commit `disabled: true`. Workflow status lives only in the
#      cluster, so if this object is ever recreated (cluster rebuild, someone
#      deletes it) an enabled spec would run the install again and wipe the disk.
#      A recreated disabled Workflow is never prepared and never enables PXE.

# Workflow for colo-server-01 Ubuntu 24.04 installation
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: colo-server-01-ubuntu
  namespace: tink-system
spec:
  disabled: true
  templateRef: ubuntu-2404
  hardwareRef: colo-server-01
  hardwareMap:
    device_1: 00:0c:29:73:03:4b
    hostname: colo-server-01
  # Automatically disable PXE boot after workflow completes
  bootOptions:
    toggleAllowNetboot: true
---
# Workflow for hammer Ubuntu 26.04 installation (r3 succeeded 2026-10-30)
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: hammer-ubuntu-2604-r3
  namespace: tink-system
spec:
  disabled: true
  templateRef: ubuntu-2604-bios
  hardwareRef: hammer
  hardwareMap:
    device_1: 00:21:9b:a4:ef:6f
    hostname: hammer
    ip_address: 108.181.38.69/27
  bootOptions:
    toggleAllowNetboot: true
