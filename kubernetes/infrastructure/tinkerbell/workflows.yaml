---
# Workflow for colo-server-01 Ubuntu 24.04 installation
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: colo-server-01-ubuntu
  namespace: tink-system
spec:
  templateRef: ubuntu-2404
  hardwareRef: colo-server-01
  hardwareMap:
    device_1: 00:0c:29:73:03:4b
    hostname: colo-server-01
  # Automatically disable PXE boot after workflow completes
  bootOptions:
    toggleAllowNetboot: true
---
# Workflow for hammer Ubuntu 26.04 installation
# Completes on its own: waitdaemon reboot reports SUCCESS, then toggleAllowNetboot
# turns PXE off. A SUCCESS Workflow never re-runs. To reinstall, RENAME this
# Workflow (don't add a second one): tink-server stops at the first non-pending
# Workflow for an agent, so a leftover SUCCESS one can block the new install.
apiVersion: tinkerbell.org/v1alpha1
kind: Workflow
metadata:
  name: hammer-ubuntu-2604-r3
  namespace: tink-system
spec:
  templateRef: ubuntu-2604-bios
  hardwareRef: hammer
  hardwareMap:
    device_1: 00:21:9b:a4:ef:6f
    hostname: hammer
    ip_address: 108.181.38.69/27
  bootOptions:
    toggleAllowNetboot: true
