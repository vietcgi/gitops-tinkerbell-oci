# Dex OIDC provider. Serves its OWN HTTPS on :5556 (web.https + tlsCert/tlsKey in the
# sealed config, pointing at the mounted omni-tls cert covering auth.qualityspace.com),
# exposed on the node via hostPort 5556. The admin's browser hits it during the OIDC flow.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
  namespace: omni-system
spec:
  replicas: 1
  selector:
    matchLabels: { app: dex }
  template:
    metadata:
      labels: { app: dex }
    spec:
      nodeSelector:
        omni.sidero.dev/host: "true"
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.41.1   # multi-arch
          args: ["dex", "serve", "/etc/dex/config.yaml"]
          ports:
            - { name: https, containerPort: 5556, hostPort: 5556, protocol: TCP }
          volumeMounts:
            - { name: config, mountPath: /etc/dex, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
      volumes:
        - name: config
          secret: { secretName: omni-dex-config }   # holds /etc/dex/config.yaml
        - name: tls
          secret: { secretName: omni-tls }
