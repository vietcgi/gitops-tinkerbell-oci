# Real (Let's Encrypt) cert for Omni + Dex — NOT self-signed (the colo Talos nodes must
# trust it for SideroLink). Uses the existing letsencrypt-prod ClusterIssuer, which solves
# via Cloudflare DNS-01 (see kubernetes/infrastructure-config/cert-manager-config/issuers.yaml),
# so no port needs to be reachable for validation. One cert, both SANs; both pods mount it.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: omni-tls
  namespace: omni-system
spec:
  secretName: omni-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  commonName: omni.qualityspace.com
  dnsNames:
    - omni.qualityspace.com
    - auth.qualityspace.com
