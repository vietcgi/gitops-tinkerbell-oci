# Omni control plane — flags verified against ghcr.io/siderolabs/omni:v1.13.1 --help.
#
# Shape (Codex-validated, $0, safest for the live client ingress): a NORMAL pod (NOT
# hostNetwork) that serves its OWN Let's Encrypt TLS on NON-443 hostPorts, so it never
# touches the production Cilium Gateway (which owns :443 for the client sites) and never
# needs a new/reserved public IP. Only the OIDC client secret rides in a mounted config
# file (no CLI flag exists for it); everything else is a reviewable flag.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: omni
  namespace: omni-system
spec:
  serviceName: omni
  replicas: 1
  selector:
    matchLabels: { app: omni }
  template:
    metadata:
      labels: { app: omni }
    spec:
      # Single-node cluster; label it: kubectl label node metal-foundry-control-plane omni.sidero.dev/host=true
      nodeSelector:
        omni.sidero.dev/host: "true"
      containers:
        - name: omni
          image: ghcr.io/siderolabs/omni:v1.13.1   # multi-arch (runs on the A1.Flex ARM node)
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          args:
            - --account-id=__OMNI_ACCOUNT_UUID__
            - --name=hammer-colo-omni
            # TLS served by Omni itself (cert covers omni.qualityspace.com)
            - --cert=/tls/tls.crt
            - --key=/tls/tls.key
            - --machine-api-cert=/tls/tls.crt
            - --machine-api-key=/tls/tls.key
            # Bind on NON-443 ports (no collision with the Gateway's :443)
            - --bind-addr=0.0.0.0:8443
            - --machine-api-bind-addr=0.0.0.0:8090
            - --k8s-proxy-bind-addr=0.0.0.0:8100
            - --event-sink-port=8091
            - --siderolink-wireguard-bind-addr=0.0.0.0:50180
            # What Omni advertises to admins/nodes (host = DNS -> 170.9.8.103; WG = raw IP)
            - --advertised-api-url=https://omni.qualityspace.com:8443/
            - --machine-api-advertised-url=https://omni.qualityspace.com:8090/
            - --advertised-kubernetes-proxy-url=https://omni.qualityspace.com:8100/
            - --siderolink-wireguard-advertised-addr=170.9.8.103:50180
            # Storage: embedded etcd + sqlite on local-path (free); key decrypts etcd
            - --storage-kind=etcd
            - --etcd-embedded=true
            - --etcd-embedded-db-path=/_out/etcd
            - --sqlite-storage-path=/_out/sqlite/omni.db
            - --private-key-source=file:///secrets/omni.asc
            # Auth via Dex (generic OIDC). clientSecret has NO flag -> comes from the
            # mounted config file below (sealed). Must match Dex staticClients secret.
            - --auth-auth0-enabled=false
            - --auth-oidc-enabled=true
            - --auth-oidc-provider-url=https://auth.qualityspace.com:5556
            - --auth-oidc-client-id=omni
            - --auth-oidc-scopes=openid,profile,email
            - --config-path=/config/omni-config.yaml
            # Required to adopt the already-running colo Talos nodes in place
            - --enable-cluster-import
            - --initial-users=__OMNI_USER_EMAIL__
            - --eula-accept-name=Kevin Vu
            - --eula-accept-email=__OMNI_USER_EMAIL__
          ports:
            - { name: api, containerPort: 8443, hostPort: 8443, protocol: TCP }
            - { name: machine-api, containerPort: 8090, hostPort: 8090, protocol: TCP }
            - { name: k8s-proxy, containerPort: 8100, hostPort: 8100, protocol: TCP }
            - { name: wireguard, containerPort: 50180, hostPort: 50180, protocol: UDP }
          volumeMounts:
            - { name: data, mountPath: /_out }
            - { name: tls, mountPath: /tls, readOnly: true }
            - { name: etcd-key, mountPath: /secrets, readOnly: true }
            - { name: oidc-config, mountPath: /config, readOnly: true }
            - { name: tun, mountPath: /dev/net/tun }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: omni-data }
        - name: tls
          secret: { secretName: omni-tls }
        - name: etcd-key
          secret: { secretName: omni-etcd-key }
        - name: oidc-config
          secret: { secretName: omni-config }   # holds /config/omni-config.yaml (auth.oidc.clientSecret)
        - name: tun
          hostPath: { path: /dev/net/tun, type: CharDevice }
