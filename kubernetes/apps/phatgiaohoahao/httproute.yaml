# Interim host while the real domain is undecided: pghh.qualityspace.com sits
# under the existing *.qualityspace.com listener and wildcard certificate, so no
# gateway or cert-manager change is required. Replace with the apex listeners
# once she chooses a domain (ticket 07).
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phatgiaohoahao
  namespace: phatgiaohoahao
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - pghh.qualityspace.com
  rules:
    - backendRefs:
        - name: phatgiaohoahao
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: phatgiaohoahao-http-redirect
  namespace: phatgiaohoahao
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http
  hostnames:
    - pghh.qualityspace.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
