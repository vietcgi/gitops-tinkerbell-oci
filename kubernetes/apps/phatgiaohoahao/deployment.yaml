apiVersion: apps/v1
kind: Deployment
metadata:
  name: phatgiaohoahao
  namespace: phatgiaohoahao
  labels:
    app.kubernetes.io/name: phatgiaohoahao
    app.kubernetes.io/part-of: phatgiaohoahao-site
spec:
  # Stateless prerendered content site. 2 replicas for zero downtime rollouts,
  # matching thienvienchanhtam and vuabaohiem.
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: phatgiaohoahao
  template:
    metadata:
      labels:
        app: phatgiaohoahao
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Image bumped by `make gitops` at every release.
          # Format: ghcr.io/vietcgi/phatgiaohoahao:<short-sha>-<UTC-yymmdd-hhmm>
          image: ghcr.io/vietcgi/phatgiaohoahao:4c158cf-20260809-0837
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: production
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
          resources:
            requests:
              cpu: 25m
              memory: 96Mi
            limits:
              cpu: 250m
              memory: 256Mi
          # Probe /vi rather than /: the root is a 307 to the default locale, so
          # probing it would depend on the proxy as well as the app.
          readinessProbe:
            httpGet:
              path: /vi
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /vi
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nextjs-cache
              mountPath: /app/.next/cache
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nextjs-cache
          emptyDir: {}
