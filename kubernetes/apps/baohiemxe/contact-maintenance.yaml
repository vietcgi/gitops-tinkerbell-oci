# Temporary contact-only gate during the durable-storage release.
# Deliberately has NO selector and NO Endpoints/EndpointSlices: Envoy returns
# 503 instead of forwarding to old pods. No workload, storage, external address,
# authentication, TLS, NetworkPolicy, firewall, or public access is added.
apiVersion: v1
kind: Service
metadata:
  name: baohiemxe-contact-maintenance
  namespace: baohiemxe
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 3200
      protocol: TCP
