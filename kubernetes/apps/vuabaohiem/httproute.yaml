# Routes vuabaohiem.com (apex) and www.vuabaohiem.com to the vuabaohiem-web Service.
# Depends on the vuabaohiem listeners + cert added to
# kubernetes/infrastructure/ingress/gateway.yaml (https-vbh-apex / http-vbh-apex
# and the *.vuabaohiem.com listeners), and the wildcard-vuabaohiem-tls Certificate.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vuabaohiem-apex
  namespace: vuabaohiem
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https-vbh-apex
  hostnames:
    - vuabaohiem.com
  rules:
    - backendRefs:
        - name: vuabaohiem-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vuabaohiem-apex-http-redirect
  namespace: vuabaohiem
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http-vbh-apex
  hostnames:
    - vuabaohiem.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# www → apex (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vuabaohiem-www-redirect
  namespace: vuabaohiem
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https-vbh
  hostnames:
    - www.vuabaohiem.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: vuabaohiem.com
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vuabaohiem-www-http-redirect
  namespace: vuabaohiem
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http-vbh
  hostnames:
    - www.vuabaohiem.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: vuabaohiem.com
            statusCode: 301
---
# West origin, addressed directly by name.
#
# This is the PRIMARY origin: it holds the lead JSONL file, which is
# vuabaohiem's system of record (there is no database). The edge Worker pins
# every write and every /admin read here and never fails those over, so lead
# data cannot split across two disks.
#
# No DNS record is needed: the existing *.vuabaohiem.com wildcard A record
# already resolves this name to this cluster, and the *.vuabaohiem.com wildcard
# listener and certificate already cover it.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vuabaohiem-origin-west
  namespace: vuabaohiem
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https-vbh
    - name: main-gateway
      namespace: ingress
      sectionName: http-vbh
  hostnames:
    - origin-west.vuabaohiem.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Served-By
                value: west
      backendRefs:
        - name: vuabaohiem-web
          port: 80
