# Routes qualityspace.com (apex) and www.qualityspace.com to the qualityspace-web Service.
# Depends on the apex listener patch in kubernetes/infrastructure/ingress/gateway.yaml.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qualityspace-apex
  namespace: qualityspace
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https-apex
  hostnames:
    - qualityspace.com
  rules:
    - backendRefs:
        - name: qualityspace-web
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qualityspace-apex-http-redirect
  namespace: qualityspace
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http-apex
  hostnames:
    - qualityspace.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# www → apex (301)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qualityspace-www-redirect
  namespace: qualityspace
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https
  hostnames:
    - www.qualityspace.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: qualityspace.com
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qualityspace-www-http-redirect
  namespace: qualityspace
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: http
  hostnames:
    - www.qualityspace.com
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            hostname: qualityspace.com
            statusCode: 301
---
# West origin, addressed directly by name.
#
# The Cloudflare Worker in front of qualityspace.com picks between origins and
# fetches the chosen one by its own hostname, so each origin needs a name that
# resolves to it specifically. This is never advertised publicly and serves the
# identical app; it exists so the edge can address one cluster deliberately.
#
# Covered by the existing "*.qualityspace.com" wildcard listener and cert, so
# no new listener or certificate is required.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qualityspace-origin-west
  namespace: qualityspace
spec:
  parentRefs:
    - name: main-gateway
      namespace: ingress
      sectionName: https
    - name: main-gateway
      namespace: ingress
      sectionName: http
  hostnames:
    - origin-west.qualityspace.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        # Which origin answered. Without this you cannot confirm during an
        # incident whether failover actually moved traffic.
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            set:
              - name: X-Served-By
                value: west
      backendRefs:
        - name: qualityspace-web
          port: 80
