# ServiceMonitor for Tinkerbell (single binary, chart v0.25+)
# Since v0.23 Smee, Tootles, metrics and health share one HTTP port named
# "http" (7080). The Service is labelled app: tinkerbell by the chart.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tinkerbell
  namespace: monitoring
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: tinkerbell
  namespaceSelector:
    matchNames:
      - tink-system
  endpoints:
    - port: http
      interval: 30s
      path: /metrics
